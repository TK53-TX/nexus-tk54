<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Front Desk to ServiceNow</title>
<style>
  :root {
    --navy: #07111E;
    --navy-2: #0A1828;
    --slate: #1E3A5F;
    --cobalt: #1A73E8;
    --cobalt-hi: #3D8BFF;
    --soft: #8AB4F8;
    --white: #FFFFFF;
    --alert: #FF5C6C;
    --ink-2: rgba(255, 255, 255, 0.74);
    --ink-3: rgba(255, 255, 255, 0.52);
    --hair: rgba(138, 180, 248, 0.16);
    --sans: "Segoe UI Variable Display", "Segoe UI Variable Text", "SF Pro Display", "SF Pro Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Code", "SF Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02070D; }
  body { font-family: var(--sans); color: var(--white); overflow: hidden; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }

  #viewport { position: fixed; inset: 0; overflow: hidden; background: #02070D; }
  .deck {
    position: absolute; top: 0; left: 0;
    width: 1600px; height: 900px;
    transform-origin: 0 0;
    padding: 20px 40px 22px;
    display: grid;
    grid-template-rows: 62px 380px 62px 1fr;
    row-gap: 14px;
    overflow: hidden;
    background:
      radial-gradient(900px 420px at 50% 34%, rgba(26, 115, 232, 0.20), transparent 70%),
      radial-gradient(600px 400px at 100% 100%, rgba(30, 58, 95, 0.55), transparent 70%),
      radial-gradient(500px 300px at 0% 0%, rgba(30, 58, 95, 0.40), transparent 70%),
      var(--navy);
  }

  /* ---------- Header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 44px; height: 44px; border-radius: 13px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--cobalt-hi), var(--cobalt) 55%, #0F4FB0);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset, 0 8px 24px rgba(26, 115, 232, 0.45);
  }
  .mark svg { width: 24px; height: 24px; }
  .kicker { font-size: 13px; color: var(--soft); font-weight: 500; letter-spacing: 0.01em; }
  h1 { margin: 2px 0 0; font-size: 27px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.1; }
  h1 span { color: var(--ink-3); font-weight: 450; }
  .top-right { display: flex; align-items: center; gap: 22px; }
  .ctl-label { font-size: 12.5px; color: var(--ink-3); margin-right: 10px; }
  .seg {
    display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px;
    background: rgba(13, 30, 52, 0.85);
    border: 1px solid var(--hair);
  }
  .seg button {
    border: 0; background: transparent; color: var(--ink-2);
    font-size: 13px; font-weight: 600; padding: 8px 15px; border-radius: 999px; cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .seg button:hover { color: var(--white); }
  .seg button[aria-pressed="true"] {
    background: linear-gradient(180deg, #2C86FA, #1766D6);
    color: var(--white);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14) inset, 0 4px 14px rgba(26, 115, 232, 0.5);
  }
  button:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }

  /* ---------- Stage SVG ---------- */
  .stage { display: block; width: 1520px; height: 380px; overflow: visible; }
  .zone { fill: rgba(16, 36, 62, 0.38); stroke: rgba(138, 180, 248, 0.14); stroke-width: 1.2; transition: fill 0.5s, stroke 0.5s; }
  .zone.live { fill: rgba(22, 50, 88, 0.55); stroke: rgba(138, 180, 248, 0.34); }
  .zone-name { fill: var(--soft); font-size: 14px; font-weight: 600; }
  .zone-sub { fill: var(--ink-3); font-size: 12.5px; }
  .zone-icon { fill: none; stroke: var(--soft); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .seam { stroke: rgba(138, 180, 248, 0.28); stroke-width: 1.2; stroke-dasharray: 2 6; }

  .s-idx { fill: var(--soft); font-size: 12.5px; font-weight: 600; }
  .s-title { fill: var(--white); font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .station .chip rect { fill: rgba(26, 115, 232, 0.10); stroke: rgba(138, 180, 248, 0.30); stroke-width: 1; }
  .station .chip text { fill: var(--ink-2); font-size: 12.5px; font-weight: 500; }
  .station .chip.code text { font-family: var(--mono); font-size: 12px; fill: var(--soft); }
  .stem { stroke: rgba(138, 180, 248, 0.40); stroke-width: 1.4; stroke-dasharray: 2 4; }

  .n-glow { fill: rgba(26, 115, 232, 0.0); transition: fill 0.4s; }
  .n-body { fill: url(#nodeIdle); stroke: rgba(138, 180, 248, 0.38); stroke-width: 1.5; transition: stroke 0.3s; }
  .n-inner { fill: none; stroke: rgba(255, 255, 255, 0.07); stroke-width: 1; }
  .n-icon path, .n-icon circle { fill: none; stroke: var(--soft); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.3s; }
  .n-active { opacity: 0; transition: opacity 0.35s; }
  .n-error { opacity: 0; transition: opacity 0.35s; }
  .burst { fill: none; stroke: var(--white); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .station.visited .n-body { stroke: rgba(61, 139, 255, 0.85); }
  .station.visited .n-icon path, .station.visited .n-icon circle { stroke: var(--white); }
  .station.active .n-active { opacity: 1; }
  .station.active .n-glow { fill: rgba(26, 115, 232, 0.30); }
  .station.active .n-body { stroke: var(--white); }
  .station.active .n-icon path, .station.active .n-icon circle { stroke: var(--white); }
  .station.active .s-title { fill: var(--white); }
  .station.error .n-error { opacity: 1; }
  .station.error .n-glow { fill: rgba(255, 92, 108, 0.28); }
  .station.error .n-body { stroke: var(--white); }
  .station.error .burst { stroke: var(--alert); }
  .station.pulse .burst { animation: burst 0.9s ease-out 1; }
  @keyframes burst { 0% { opacity: 0.95; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
  .sbadge { opacity: 0; transition: opacity 0.3s; }
  .sbadge.on { opacity: 1; }
  .sbadge rect { stroke: var(--navy); stroke-width: 2.5; }
  .sbadge text { font-size: 12px; font-weight: 750; }
  .sbadge.s200 rect { fill: var(--cobalt); } .sbadge.s200 text { fill: var(--white); }
  .sbadge.s202 rect { fill: var(--soft); } .sbadge.s202 text { fill: var(--navy); }
  .sbadge.s201 rect { fill: var(--white); } .sbadge.s201 text { fill: var(--navy); }
  .sbadge.s4xx rect { fill: var(--alert); } .sbadge.s4xx text { fill: var(--white); }

  .tube { fill: none; stroke: #102640; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
  .tube-edge { fill: none; stroke: rgba(138, 180, 248, 0.20); stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
  .tube-core { fill: none; stroke: #07111E; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .flow { fill: none; stroke-width: 2; stroke-dasharray: 3 13; stroke-linecap: round; animation: flow 1.2s linear infinite; }
  .flow.fwd { stroke: rgba(138, 180, 248, 0.55); }
  .flow.ret { stroke: rgba(138, 180, 248, 0.38); }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  .lit { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.4s; }
  .lit.fwd { stroke: var(--cobalt-hi); }
  .lit.ret { stroke: var(--soft); }
  .chev { fill: none; stroke: var(--soft); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .lane-label { fill: var(--ink-3); font-size: 13px; font-weight: 500; }
  .lane-label tspan.hl { fill: var(--soft); font-weight: 600; }

  .comet { fill: none; stroke-linecap: round; opacity: 0; }
  .comet.c1 { stroke-width: 14; }
  .comet.c2 { stroke-width: 8; }
  .comet.c3 { stroke-width: 4; }
  #orb .o-halo { transform-box: fill-box; transform-origin: center; animation: breathe 1.5s ease-in-out infinite; }
  #orb .o-ring { fill: none; stroke-width: 1.6; stroke-dasharray: 5 6; transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
  #orb .o-core { stroke: var(--white); stroke-width: 1.5; }
  @keyframes breathe { 0%, 100% { transform: scale(0.85); opacity: 0.85; } 50% { transform: scale(1.25); opacity: 0.35; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .k-req .o-halo { fill: rgba(61, 139, 255, 0.45); } .k-req .o-ring { stroke: var(--white); } .k-req .o-core { fill: url(#orbReq); }
  .k-ret .o-halo { fill: rgba(138, 180, 248, 0.45); } .k-ret .o-ring { stroke: var(--white); } .k-ret .o-core { fill: url(#orbRet); }
  .k-safe .o-halo { fill: rgba(138, 180, 248, 0.45); } .k-safe .o-ring { stroke: var(--white); } .k-safe .o-core { fill: url(#orbRet); }
  .k-err .o-halo { fill: rgba(255, 92, 108, 0.45); } .k-err .o-ring { stroke: #FFD3D8; } .k-err .o-core { fill: url(#orbErr); }
  .comets-req .comet { stroke: var(--cobalt-hi); }
  .comets-ret .comet, .comets-safe .comet { stroke: var(--soft); }
  .comets-err .comet { stroke: var(--alert); }

  #tag .t-lead { stroke-width: 1.4; }
  #tag .t-body { stroke-width: 1.2; }
  #tag .t-text { font-family: var(--mono); font-size: 12.5px; font-weight: 700; }
  #tag.k-req .t-body { fill: #0D2A4E; stroke: var(--cobalt-hi); } #tag.k-req .t-text { fill: var(--white); } #tag.k-req .t-lead { stroke: var(--cobalt-hi); }
  #tag.k-ret .t-body, #tag.k-safe .t-body { fill: #E8F0FE; stroke: var(--white); }
  #tag.k-ret .t-text, #tag.k-safe .t-text { fill: var(--navy); }
  #tag.k-ret .t-lead, #tag.k-safe .t-lead { stroke: var(--soft); }
  #tag.k-err .t-body { fill: #3A0F18; stroke: var(--alert); } #tag.k-err .t-text { fill: #FFD3D8; } #tag.k-err .t-lead { stroke: var(--alert); }

  /* ---------- Transport bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 18px;
    padding: 0 12px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(18, 40, 68, 0.75), rgba(10, 24, 42, 0.85));
    border: 1px solid var(--hair);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 16px 40px rgba(0, 0, 0, 0.35);
  }
  .tgroup { display: flex; align-items: center; gap: 6px; flex: none; }
  .tbtn {
    height: 38px; padding: 0 15px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 600; color: var(--ink-2);
    background: rgba(30, 58, 95, 0.45);
    border: 1px solid rgba(138, 180, 248, 0.18);
    cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .tbtn svg { width: 14px; height: 14px; fill: currentColor; }
  .tbtn:hover { color: var(--white); border-color: rgba(138, 180, 248, 0.45); }
  .tbtn[aria-pressed="true"] {
    color: var(--white);
    background: linear-gradient(180deg, #2C86FA, #1766D6);
    border-color: transparent;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14) inset, 0 4px 14px rgba(26, 115, 232, 0.5);
  }
  .tbtn.sq { width: 38px; padding: 0; justify-content: center; }
  .tbtn.speed { padding: 0 12px; min-width: 50px; justify-content: center; }

  .stepper { position: relative; flex: 1; height: 62px; min-width: 0; }
  .rail { position: absolute; top: 20px; height: 2px; background: rgba(138, 180, 248, 0.18); border-radius: 2px; }
  .rail i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--cobalt), var(--cobalt-hi)); box-shadow: 0 0 10px rgba(61, 139, 255, 0.8); border-radius: 2px; }
  .steps { position: absolute; inset: 0; display: flex; }
  .step {
    flex: 1; min-width: 0; border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 9px 2px 0; gap: 6px; color: var(--ink-3);
  }
  .step .d {
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11.5px; font-weight: 750;
    background: var(--navy-2); color: var(--ink-3);
    border: 1.5px solid rgba(138, 180, 248, 0.32);
    transition: all 0.25s;
  }
  .step .l { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .step.done { color: var(--ink-2); }
  .step.done .d { background: var(--cobalt); border-color: var(--cobalt); color: var(--white); }
  .step.current { color: var(--white); }
  .step.current .d { background: var(--white); border-color: var(--white); color: var(--navy); box-shadow: 0 0 0 4px rgba(61, 139, 255, 0.35), 0 0 16px rgba(61, 139, 255, 0.8); }
  .step.err .d { border-color: var(--alert); color: var(--alert); }
  .step.err.done .d { background: var(--alert); color: var(--white); }
  .step.err.current .d { background: var(--alert); border-color: var(--alert); color: var(--white); box-shadow: 0 0 0 4px rgba(255, 92, 108, 0.3), 0 0 16px rgba(255, 92, 108, 0.7); }

  /* ---------- Inspector ---------- */
  .inspector { display: grid; grid-template-columns: 504px 440px 1fr; gap: 16px; min-height: 0; position: relative; }
  .narrative {
    position: relative; min-height: 0; overflow: hidden;
    padding: 18px 22px 18px 24px;
    border-radius: 6px 20px 20px 6px;
    background: linear-gradient(90deg, rgba(26, 115, 232, 0.10), rgba(10, 24, 42, 0.0) 70%);
    border-left: 3px solid var(--cobalt-hi);
    display: flex; flex-direction: column;
    transition: border-color 0.3s;
  }
  .narrative.err { border-left-color: var(--alert); background: linear-gradient(90deg, rgba(255, 92, 108, 0.10), rgba(10, 24, 42, 0.0) 70%); }
  .n-head { display: flex; align-items: flex-start; gap: 16px; }
  .numeral {
    font-size: 50px; font-weight: 800; line-height: 0.92; letter-spacing: -0.04em;
    color: transparent; -webkit-text-stroke: 1.4px var(--soft);
    text-shadow: 0 0 22px rgba(61, 139, 255, 0.45);
    min-width: 54px;
  }
  .narrative.err .numeral { -webkit-text-stroke-color: var(--alert); text-shadow: 0 0 22px rgba(255, 92, 108, 0.4); }
  .n-where { font-size: 13px; color: var(--soft); font-weight: 600; }
  .n-title { margin: 3px 0 0; font-size: 19px; font-weight: 650; line-height: 1.22; letter-spacing: -0.01em; }
  .summary { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); max-width: 62ch; }
  .why { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .why li { display: flex; gap: 10px; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
  .why li svg { flex: none; width: 16px; height: 16px; margin-top: 1px; }
  .why li svg path { fill: none; stroke: var(--cobalt-hi); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .narrative.err .why li svg path { stroke: var(--alert); }
  .outcome { margin-top: auto; padding-top: 12px; font-size: 13.5px; font-weight: 600; color: var(--white); display: flex; align-items: center; gap: 8px; }
  .outcome::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cobalt-hi); box-shadow: 0 0 10px var(--cobalt-hi); }
  .narrative.err .outcome::before { background: var(--alert); box-shadow: 0 0 10px var(--alert); }
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(138, 180, 248, 0.08); }
  .prog i { display: block; height: 100%; width: 0; background: var(--cobalt-hi); box-shadow: 0 0 10px var(--cobalt-hi); }
  .narrative.err .prog i { background: var(--alert); box-shadow: 0 0 10px var(--alert); }

  .slip {
    min-height: 0; overflow: hidden;
    padding: 18px 20px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(20, 44, 74, 0.72), rgba(10, 24, 42, 0.82));
    border: 1px solid var(--hair);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset;
    display: flex; flex-direction: column; gap: 11px;
  }
  .slip-head { display: flex; justify-content: space-between; align-items: center; }
  .slip-title { font-size: 14px; font-weight: 650; }
  .slip-proto { font-size: 12.5px; color: var(--ink-3); }
  .route { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .route .rc { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 8px; background: rgba(26, 115, 232, 0.14); border: 1px solid rgba(138, 180, 248, 0.28); color: var(--white); }
  .route svg { width: 16px; height: 16px; }
  .route svg path { fill: none; stroke: var(--soft); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ep { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(2, 7, 13, 0.6); border: 1px solid var(--hair); }
  .method { flex: none; font-family: var(--mono); font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: var(--cobalt); color: var(--white); }
  .ep code { font-family: var(--mono); font-size: 12.5px; line-height: 1.45; color: var(--white); word-break: break-all; }
  .hdrs { display: grid; gap: 4px; }
  .hdr { display: grid; grid-template-columns: 104px 1fr; gap: 10px; font-size: 12px; line-height: 1.4; }
  .hdr .hk { color: var(--ink-3); }
  .hdr .hv { color: var(--ink-2); font-family: var(--mono); font-size: 11.5px; word-break: break-word; }
  .hdr.note .hv { font-family: var(--sans); font-size: 12px; }
  .status-row { display: flex; align-items: center; gap: 12px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    font-family: var(--mono); font-size: 15px; font-weight: 800;
    padding: 6px 13px; border-radius: 9px;
    border: 1px solid rgba(138, 180, 248, 0.35); color: var(--ink-3);
    transition: background 0.25s, color 0.25s, border-color 0.25s;
  }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.pending { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
  .status.s200 { background: var(--cobalt); border-color: var(--cobalt); color: var(--white); box-shadow: 0 0 18px rgba(26, 115, 232, 0.45); }
  .status.s202 { background: rgba(138, 180, 248, 0.16); border-color: var(--soft); color: var(--soft); }
  .status.s201 { background: var(--white); border-color: var(--white); color: var(--navy); box-shadow: 0 0 18px rgba(255, 255, 255, 0.3); }
  .status.s4xx { background: rgba(255, 92, 108, 0.16); border-color: var(--alert); color: var(--alert); box-shadow: 0 0 18px rgba(255, 92, 108, 0.3); }
  .meaning { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
  .tech { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  .tech li { font-size: 12px; line-height: 1.4; color: var(--ink-3); padding-left: 14px; position: relative; }
  .tech li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 1.5px; background: var(--soft); }

  .well {
    min-height: 0; overflow: hidden;
    border-radius: 14px;
    background: #040B14;
    border: 1px solid var(--hair);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4) inset, 0 12px 32px rgba(0, 0, 0, 0.35);
    display: flex; flex-direction: column;
  }
  .well-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--hair); background: rgba(18, 40, 68, 0.45); }
  .dir { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .dir b { font-weight: 600; color: var(--white); }
  .tabs { display: inline-flex; padding: 3px; border-radius: 9px; background: rgba(2, 7, 13, 0.7); border: 1px solid var(--hair); }
  .tab { border: 0; background: transparent; color: var(--ink-3); font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--slate); color: var(--white); box-shadow: 0 0 0 1px rgba(138, 180, 248, 0.3) inset; }
  .json { flex: 1; min-height: 0; overflow: auto; padding: 10px 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: rgba(255, 255, 255, 0.45); }
  .json .ln { display: grid; grid-template-columns: 40px 1fr; }
  .json .ln i { font-style: normal; text-align: right; padding-right: 14px; color: rgba(138, 180, 248, 0.28); user-select: none; }
  .json .ln span.c { white-space: pre-wrap; word-break: break-word; padding-right: 16px; }
  .json .k { color: var(--soft); }
  .json .s { color: var(--white); }
  .json .n { color: #9FE3FF; }
  .json .b { color: #F2C14E; }
  .json::-webkit-scrollbar { width: 8px; } .json::-webkit-scrollbar-thumb { background: rgba(138, 180, 248, 0.2); border-radius: 8px; }

  .impact { display: none; }
  .deck.exec-view .inspector { grid-template-columns: 1.1fr 1fr; }
  .deck.exec-view .slip, .deck.exec-view .well { display: none; }
  .deck.exec-view .narrative .why { display: none; }
  .deck.exec-view .summary { font-size: 18px; line-height: 1.6; }
  .deck.exec-view .n-title { font-size: 26px; }
  .deck.exec-view .impact {
    display: flex; flex-direction: column; gap: 14px;
    padding: 20px 24px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(20, 44, 74, 0.72), rgba(10, 24, 42, 0.82));
    border: 1px solid var(--hair);
  }
  .impact-head { display: flex; justify-content: space-between; align-items: center; }
  .impact-head span { font-size: 15px; font-weight: 650; }

  .impact li b { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 14px; color: var(--white); background: linear-gradient(145deg, var(--cobalt-hi), var(--cobalt)); box-shadow: 0 4px 14px rgba(26, 115, 232, 0.45); }
  .deck.exec-view .impact.err li b { background: linear-gradient(145deg, #FF7A88, #D93A4C); box-shadow: 0 4px 14px rgba(255, 92, 108, 0.4); }

  .speaker {
    position: absolute; left: 40px; right: 40px; bottom: 22px; height: 290px; z-index: 10;

    border-radius: 18px;
    background: linear-gradient(180deg, #0E2240, #07111E);
    border: 1px solid var(--cobalt);
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.55);
  }

  .speaker-head b { font-size: 15px; font-weight: 650; color: var(--soft); }
  .speaker-head span { font-size: 13px; color: var(--ink-3); }
  .speaker ul { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
  .speaker li { font-size: 22px; line-height: 1.4; }

  @media (prefers-reduced-motion: reduce) {
    .flow, #orb .o-halo, #orb .o-ring, .status.pending { animation: none; }
  }

<div id="viewport">
<main class="deck" id="deck">

</main>

    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / 1600, h / 900);
    $("deck").style.transform = "translate(" + ((w - 1600 * s) / 2).toFixed(1) + "px," + ((h - 900 * s) / 2).toFixed(1) + "px) scale(" + s.toFixed(4) + ")";
  }

  $("btnPlay").addEventListener("click", play);
  $("btnPause").addEventListener("click", function () { setPlaying(false); });
  $("btnFwd").addEventListener("click", function () { step(1); });
  $("btnBack").addEventListener("click", function () { step(-1); });
  $("btnNotes").addEventListener("click", toggleNotes);
  $("btnFull").addEventListener("click", toggleFull);
  Array.prototype.forEach.call(document.querySelectorAll("[data-speed]"), function (b) {
    b.addEventListener("click", function () { setSpeed(parseFloat(b.getAttribute("data-speed"))); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-scen]"), function (b) {
    b.addEventListener("click", function () { setScenario(b.getAttribute("data-scen"), 0, state.playing ? 0 : 1); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (b) {
    b.addEventListener("click", function () { setView(b.getAttribute("data-view")); });
  });
  $("tabReq").addEventListener("click", function () { state.tabAuto = false; showTab("req"); });
  $("tabRes").addEventListener("click", function () { state.tabAuto = false; showTab("res"); });
  window.addEventListener("resize", fit);
  document.addEventListener("fullscreenchange", fit);

  document.addEventListener("keydown", function (ev) {
    if (ev.target && ev.target.tagName === "BUTTON" && (ev.key === " " || ev.key === "Enter")) return;
    var k = ev.key;
    if (k === " ") { ev.preventDefault(); if (state.playing) setPlaying(false); else play(); }
    else if (k === "ArrowRight") step(1);
    else if (k === "ArrowLeft") step(-1);
    else if (k === "f" || k === "F") toggleFull();
    else if (k === "n" || k === "N") toggleNotes();
    else if (k === "e" || k === "E") setView($("deck").classList.contains("exec-view") ? "full" : "exec");
    else if (k === "1") setSpeed(0.5);
    else if (k === "2") setSpeed(1);
    else if (k === "3") setSpeed(2);
  });

  /* ---------- Start ---------- */
  fit();
  layoutChips();
  var hash = location.hash || "";
  var mS = /s=(\w+)/.exec(hash), mP = /p=(\d+)/.exec(hash);
  if (mP) { setPlaying(false); setScenario(mS ? mS[1] : "happy", parseInt(mP[1], 10) - 1, 1); }
  else setScenario(mS ? mS[1] : "happy", 0, 0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
